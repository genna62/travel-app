    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .day-btn {
            transition: all 0.3s ease;
        }
        .day-btn.active {
            background: linear-gradient(135deg, #e11d48, #f97316);
            color: white;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3);
            border-color: transparent;
            transform: translateY(-2px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .tab-btn.active {
            color: #e11d48;
        }
        .tab-btn.active .icon-container {
            background-color: #ffe4e6;
            border-radius: 9999px;
            padding: 0.25rem 1rem;
        }
    </style>
</head>
<body class="text-gray-800 antialiased flex justify-center selection:bg-rose-200 h-[100dvh] w-screen overflow-hidden bg-gray-200">

                </div>
            </div>
        </header>

        <!-- Daily Itinerary View -->

                </div>
            </div>

            <div id="day-content" class="p-4 space-y-4 flex-1 overflow-y-auto pb-6">
                <!-- Dynamic Day Content -->
            </div>
        </main>

        <!-- Travel Info View -->
        <main id="view-info" class="hidden p-4 space-y-4 flex-1 overflow-y-auto bg-gray-50 pb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fa-solid fa-clipboard-list text-emerald-500 mr-2"></i> 旅遊須知
            </h2>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">
                <h3 class="font-bold text-rose-600 mb-3 text-lg"><i class="fa-solid fa-battery-full mr-2"></i>極重要：外置充電器</h3>
                <p class="text-base text-gray-700 font-bold bg-rose-50 p-3 rounded-xl text-rose-800 border border-rose-100">

            </div>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">

            </div>
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4">

                    🇵🇹 葡萄牙：比香港慢 7 小時
                </p>

        </main>

        function loadData() {
            const saved = localStorage.getItem('spain_portugal_itinerary_v9');
            if (saved) {
                try {
                    dailyData = JSON.parse(saved);
                } catch (e) {
                    dailyData = JSON.parse(JSON.stringify(defaultDailyData));
                }
            } else {
                dailyData = JSON.parse(JSON.stringify(defaultDailyData));
            }
            dailyData.forEach(d => {

                if (fresh && fresh.weatherPlace) d.weatherPlace = fresh.weatherPlace;
                d.weather = null;
            });

        function saveData() {
            const payload = dailyData.map(d => {

                delete copy.weather;
                return copy;

        function weatherStyle(code) {
            const c = Number(code);
            if (c === 0) return { icon: "fa-sun", color: "text-orange-500", desc: "晴朗" };
            if (c === 1) return { icon: "fa-sun", color: "text-amber-500", desc: "大致晴朗" };
            if (c === 2) return { icon: "fa-cloud-sun", color: "text-amber-500", desc: "部分時間有雲" };
            if (c === 3) return { icon: "fa-cloud", color: "text-gray-500", desc: "陰天" };
            if (c === 45 || c === 48) return { icon: "fa-smog", color: "text-gray-400", desc: "有霧" };
            if (c >= 51 && c <= 57) return { icon: "fa-cloud-rain", color: "text-blue-400", desc: "毛毛雨" };
            if (c >= 61 && c <= 67) return { icon: "fa-cloud-rain", color: "text-blue-500", desc: "有雨" };
            if (c >= 71 && c <= 77) return { icon: "fa-snowflake", color: "text-sky-400", desc: "有雪" };
            if (c >= 80 && c <= 82) return { icon: "fa-cloud-showers-heavy", color: "text-blue-500", desc: "驟雨" };
            if (c === 85 || c === 86) return { icon: "fa-snowflake", color: "text-sky-400", desc: "陣雪" };
            if (c >= 95) return { icon: "fa-cloud-bolt", color: "text-yellow-500", desc: "雷暴" };
            return { icon: "fa-cloud", color: "text-gray-500", desc: "多雲" };
        }

        let weatherRequest = 0;

        async function loadWeather(silent) {
            const requestId = ++weatherRequest;
            if (!silent) {
                dailyData.forEach(d => {
                    if (d.weatherPlace) d.weather = { loading: true, place: d.weatherPlace.name };
                });
                selectDay(currentDay);
            }

            const groups = new Map();
            dailyData.forEach(d => {
                const place = d.weatherPlace;
                if (!place) return;
                const key = `${place.lat},${place.lng}`;
                if (!groups.has(key)) groups.set(key, { lat: place.lat, lng: place.lng, days: [] });
                groups.get(key).days.push(d);
            });

            await Promise.all([...groups.values()].map(async (group) => {
                const dates = group.days.map(d => d.weatherPlace.date).sort();
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${group.lat}&longitude=${group.lng}&models=gfs_seamless&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${dates[0]}&end_date=${dates[dates.length - 1]}`;
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(String(res.status));
                    const json = await res.json();
                    const byDate = {};
                    (json.daily?.time || []).forEach((date, i) => {
                        byDate[date] = {
                            code: json.daily.weather_code[i],
                            max: json.daily.temperature_2m_max[i],
                            min: json.daily.temperature_2m_min[i]
                        };
                    });
                    group.days.forEach(d => {
                        const row = byDate[d.weatherPlace.date];
                        if (!row || row.max == null || row.min == null) {
                            if (!silent || !d.weather || d.weather.loading) {
                                d.weather = { error: true, place: d.weatherPlace.name };
                            }
                            return;
                        }
                        const style = weatherStyle(row.code);
                        d.weather = {
                            temp: `${Math.round(row.min)}°C - ${Math.round(row.max)}°C`,
                            icon: style.icon,
                            color: style.color,
                            desc: style.desc,
                            place: d.weatherPlace.name
                        };
                    });
                } catch (e) {
                    group.days.forEach(d => {
                        if (!silent || !d.weather || d.weather.loading) {
                            d.weather = { error: true, place: d.weatherPlace.name };
                        }
                    });
                }
            }));

            if (requestId === weatherRequest) selectDay(currentDay);
        }

        function startWeatherRefresh() {
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') loadWeather(true);

            setInterval(() => loadWeather(true), 10 * 60 * 1000);

        function weekdayShort(data) {
            const iso = data.weatherPlace && data.weatherPlace.date;
            if (!iso) return "";
            const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            return names[new Date(iso + "T12:00:00").getDay()];
        }

        function formatDayMonth(data) {
            const iso = data.weatherPlace && data.weatherPlace.date;
            if (!iso) return data.date || "";
            const parts = iso.split("-");
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${Number(parts[2])} ${months[Number(parts[1]) - 1]}`;
        }

        function spotMapUrl(s) {
            if (s.mapUrl) return s.mapUrl;
            const q = s.query || (typeof s.lat === 'number' ? `${s.lat},${s.lng}` : s.name);
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
        }

        function escapeAttr(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;');
        }

        function mapTargetFromInput(text) {
            const value = text.trim();
            if (!value) return null;
            if (/^https?:\/\//i.test(value)) {
                const at = value.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
                if (at) return { query: `${at[1]},${at[2]}`, lat: Number(at[1]), lng: Number(at[2]), mapUrl: value };
                const q = value.match(/[?&]query=([^&]+)/);
                if (q) {
                    const decoded = decodeURIComponent(q[1].replace(/\+/g, ' '));
                    const coord = decoded.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
                    if (coord) return { query: `${coord[1]},${coord[2]}`, lat: Number(coord[1]), lng: Number(coord[2]) };
                    return { query: decoded };
                }
                return { mapUrl: value, query: value };
            }
            const coord = value.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
            if (coord) return { query: `${coord[1]},${coord[2]}`, lat: Number(coord[1]), lng: Number(coord[2]) };
            return { query: value };
        }

        function addSpotInput(spot = '') {
            const name = typeof spot === 'string' ? spot : (spot.name || '');
            const mapValue = typeof spot === 'string' ? '' : (spot.mapUrl || spot.query || '');
            const container = document.getElementById('edit-spots-container');

            div.innerHTML = `
                <div class="flex gap-2">

        function saveDayData() {
            const data = dailyData.find(d => d.day === currentDay);
            if (!data) return;
            data.city = document.getElementById('edit-city').value;
            data.title = document.getElementById('edit-title').value;
            data.route = document.getElementById('edit-route').value;
            
            const spotItems = document.querySelectorAll('.spot-item');
            const previousSpots = Array.isArray(data.spots) ? data.spots.slice() : [];
            const cityNameForSearch = data.city
                .replace(/\(.*?\)/g, '')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            data.spots = Array.from(spotItems)
                .map(item => {
                    const name = item.querySelector('.spot-input').value.trim();
                    const loc = item.querySelector('.spot-map-input').value.trim();
                    if (!name) return null;
                    const parsed = mapTargetFromInput(loc);
                    if (parsed) {
                        const spot = { name, query: parsed.query || name };
                        if (typeof parsed.lat === 'number') {
                            spot.lat = parsed.lat;
                            spot.lng = parsed.lng;
                        }
                        if (parsed.mapUrl) spot.mapUrl = parsed.mapUrl;
                        return spot;
                    }
                    const existing = previousSpots.find(s => s.name === name && s.query);
                    if (existing) return { ...existing, name };
                    return { name, query: `${name} ${cityNameForSearch}`.trim() };
                })
                .filter(Boolean);
                
            data.meals.b = document.getElementById('edit-meal-b').value;
            data.meals.l = document.getElementById('edit-meal-l').value;
            data.meals.d = document.getElementById('edit-meal-d').value;
            data.hotel = document.getElementById('edit-hotel').value;

            saveData();
            closeEditModal();
            selectDay(currentDay);
        }
    </script>
</body>
</html>
